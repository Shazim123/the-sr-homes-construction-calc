<!DOCTYPE html>
<html>
<head>
    <title>Footing Reinforcement Calculator - The SR Homes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>The SR Homes</h1>
    <p>Footing Reinforcement Calculator</p>
</header>

<section class="card">

<h2>Isolated Footing Steel Calculator</h2>

<label>Footing Length (m)</label>
<input id="flength" type="number">

<label>Footing Width (m)</label>
<input id="fwidth" type="number">

<label>Bar Diameter (mm)</label>
<select id="dia">
    <option value="8">8 mm</option>
    <option value="10">10 mm</option>
    <option value="12">12 mm</option>
    <option value="16">16 mm</option>
</select>

<label>Bar Spacing (mm)</label>
<input id="spacing" type="number">

<label>Concrete Cover (mm)</label>
<input id="cover" type="number" value="50">

<button onclick="calculateFooting()">
Calculate
</button>

<div id="result"></div>

</section>

<script src="footing.js"></script>

</body>
</html>
