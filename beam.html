<!DOCTYPE html>
<html>
<head>
    <title>Beam Reinforcement Calculator - The SR Homes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>The SR Homes</h1>
    <p>Beam Reinforcement Calculator</p>
</header>

<section class="card">

<h2>Beam Steel Calculator</h2>

<label>Beam Width (mm)</label>
<input id="bwidth" type="number">

<label>Beam Depth (mm)</label>
<input id="bdepth" type="number">

<label>Beam Length (m)</label>
<input id="blength" type="number">

<label>Bottom Bar Diameter (mm)</label>
<select id="bottomDia">
    <option value="12">12 mm</option>
    <option value="16">16 mm</option>
    <option value="20">20 mm</option>
    <option value="25">25 mm</option>
</select>

<label>Number of Bottom Bars</label>
<input id="bottomBars" type="number">

<label>Top Bar Diameter (mm)</label>
<select id="topDia">
    <option value="10">10 mm</option>
    <option value="12">12 mm</option>
    <option value="16">16 mm</option>
</select>

<label>Number of Top Bars</label>
<input id="topBars" type="number">

<label>Stirrup Diameter (mm)</label>
<select id="stDia">
    <option value="6">6 mm</option>
    <option value="8">8 mm</option>
    <option value="10">10 mm</option>
</select>

<label>Stirrup Spacing (mm)</label>
<input id="spacing" type="number">

<label>Concrete Cover (mm)</label>
<input id="cover" type="number" value="40">

<button onclick="calculateBeam()">
Calculate
</button>

<div id="result"></div>

</section>

<script src="beam.js"></script>

</body>
</html>
