<!DOCTYPE html>
<html>
<head>
    <title>Slab Reinforcement Calculator - The SR Homes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>The SR Homes</h1>
    <p>Slab Reinforcement Calculator</p>
</header>

<section class="card">

<h2>RCC Slab Steel Calculator</h2>

<label>Slab Length (m)</label>
<input id="slength" type="number">

<label>Slab Width (m)</label>
<input id="swidth" type="number">


<h3>Main Reinforcement</h3>

<label>Main Bar Diameter (mm)</label>
<select id="mainDia">
    <option value="8">8 mm</option>
    <option value="10">10 mm</option>
    <option value="12">12 mm</option>
</select>

<label>Main Bar Spacing (mm)</label>
<input id="mainSpacing" type="number">


<h3>Distribution Reinforcement</h3>

<label>Distribution Bar Diameter (mm)</label>
<select id="distDia">
    <option value="8">8 mm</option>
    <option value="10">10 mm</option>
</select>

<label>Distribution Bar Spacing (mm)</label>
<input id="distSpacing" type="number">


<label>Concrete Cover (mm)</label>
<input id="cover" type="number" value="20">


<button onclick="calculateSlab()">
Calculate
</button>

<div id="result"></div>

</section>

<script src="slab.js"></script>

</body>
</html>
