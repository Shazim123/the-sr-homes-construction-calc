<!DOCTYPE html>
<html>
<head>
    <title>Steel Weight Calculator - The SR Homes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>The SR Homes</h1>
    <p>Steel Weight Calculator</p>
</header>

<section class="card">

<h2>Reinforcement Steel Calculator</h2>

<label>Bar Diameter (mm)</label>
<select id="dia">
    <option value="6">6 mm</option>
    <option value="8">8 mm</option>
    <option value="10">10 mm</option>
    <option value="12">12 mm</option>
    <option value="16">16 mm</option>
    <option value="20">20 mm</option>
    <option value="25">25 mm</option>
    <option value="32">32 mm</option>
</select>

<label>Length of Bar (m)</label>
<input id="length" type="number">

<label>Number of Bars</label>
<input id="qty" type="number" value="1">

<button onclick="calculateSteel()">
Calculate
</button>

<div id="result"></div>

</section>

<script src="steel.js"></script>

</body>
</html>
