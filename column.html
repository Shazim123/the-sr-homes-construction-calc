<!DOCTYPE html>
<html>
<head>
    <title>Column Reinforcement Calculator - The SR Homes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>The SR Homes</h1>
    <p>Column Reinforcement Calculator</p>
</header>

<section class="card">

<h2>Column Steel Calculator</h2>

<label>Column Length (mm)</label>
<input id="clength" type="number">

<label>Column Width (mm)</label>
<input id="cwidth" type="number">

<label>Column Height (m)</label>
<input id="height" type="number">

<label>Main Bar Diameter (mm)</label>
<select id="mainDia">
    <option value="12">12 mm</option>
    <option value="16">16 mm</option>
    <option value="20">20 mm</option>
    <option value="25">25 mm</option>
</select>

<label>Number of Main Bars</label>
<input id="mainBars" type="number">

<label>Stirrup Diameter (mm)</label>
<select id="stDia">
    <option value="6">6 mm</option>
    <option value="8">8 mm</option>
    <option value="10">10 mm</option>
</select>

<label>Stirrup Spacing (mm)</label>
<input id="spacing" type="number">

<label>Concrete Cover (mm)</label>
<input id="cover" type="number" value="40">

<button onclick="calculateColumn()">
Calculate
</button>

<div id="result"></div>

</section>

<script src="column.js"></script>

</body>
</html>
