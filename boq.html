<!DOCTYPE html>
<html>

<head>

<title>BOQ Generator - The SR Homes</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>


<body>

<header>

<h1>The SR Homes</h1>

<p>
Building Quantity & BOQ Generator
</p>

</header>


<section class="card">

<h2>BOQ Calculator</h2>
<label>Project Name</label>
<input id="project" type="text" placeholder="Example: Residential Building">

<label>Client Name</label>
<input id="client" type="text" placeholder="Client Name">

<label>Engineer Name</label>
<input id="engineer" type="text" placeholder="Engineer Name">

<label>Report Date</label>
<input id="date" type="date">

<h3>RCC Work</h3>

<label>Concrete Quantity (m³)</label>
<input id="concrete" type="number">


<label>Concrete Rate (₹/m³)</label>
<input id="concreteRate" type="number">



<label>Steel Quantity (kg)</label>
<input id="steel" type="number">


<label>Steel Rate (₹/kg)</label>
<input id="steelRate" type="number">



<h3>Masonry Work</h3>

<label>Brickwork Quantity (m³)</label>
<input id="brick" type="number">


<label>Brickwork Rate (₹/m³)</label>
<input id="brickRate" type="number">



<h3>Finishing Work</h3>

<label>Plaster Area (m²)</label>
<input id="plaster" type="number">


<label>Plaster Rate (₹/m²)</label>
<input id="plasterRate" type="number">



<h3>Labour</h3>

<label>Labour Cost (₹)</label>
<input id="labour" type="number">


<button onclick="calculateBOQ()">
Generate BOQ
</button>

<button onclick="saveProject()">
Save Project
</button>

<button onclick="downloadBOQPDF()">
Download BOQ PDF
</button>


<div id="result"></div>


</section>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="boq.js"></script>


</body>

</html>
