<!DOCTYPE html>
<html>
<head>
    <title>BBS Generator - The SR Homes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>The SR Homes</h1>
    <p>Bar Bending Schedule Generator</p>
</header>

<section class="card">

<h2>BBS Calculator</h2>

<label>Bar Mark</label>
<input id="mark" type="text" placeholder="Example: B1">

<label>Bar Diameter (mm)</label>
<select id="dia">
    <option value="8">8 mm</option>
    <option value="10">10 mm</option>
    <option value="12">12 mm</option>
    <option value="16">16 mm</option>
    <option value="20">20 mm</option>
    <option value="25">25 mm</option>
    <option value="32">32 mm</option>
</select>

<label>Number of Bars</label>
<input id="qty" type="number">

<label>Cutting Length (m)</label>
<input id="length" type="number">


<button onclick="addBar()">
Add Bar
</button>

<div id="result"></div>

</section>

<script src="bbs.js"></script>

</body>
</html>
